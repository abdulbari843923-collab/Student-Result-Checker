<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student-Result-Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Student Result Checker</h1>
    <form id="resultForm">
        <label>Student name</label>
        <input type="text" id="studentName" placeholder="Enter your name" required>

        
        <label>maths Marks</label>
        <input type="number" id="maths" placeholder="maths marks" min="0" max="100" step="1" required>


        <label>English marks</label>
        <input type="number" id="english" placeholder="Enter English marks" min="0" max="100" step="1" required>

        <label>Science marks</label>
        <input type="number" id="science" placeholder="Enter Science marks" min="0" max="100" step="1" required>
        <button type="submit">Calculate Result</button>

    </form>


        <div id="result"></div>
    
      <script src="script.js"></script>

</body>

</html>
